name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Expo prebuild Android
        working-directory: app
        run: npx expo prebuild --platform android --non-interactive

      - name: Set Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> app/android/gradle.properties
          echo "org.gradle.daemon=false" >> app/android/gradle.properties
          echo "org.gradle.workers.max=2" >> app/android/gradle.properties
          echo "org.gradle.parallel=false" >> app/android/gradle.properties

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiftLog-release-apk
          path: app/android/app/build/outputs/apk/release/*.apk
